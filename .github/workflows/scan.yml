name: COMC Scan

# Headless functional scan: targeted mode browses the WotC sets in comc_set_slugs.json
# via COMC set-path URLs (Cloudflare-cleared by Firecrawl) and reports NM-only deals.
#
# REQUIRES a repo secret FIRECRAWL_API_KEY (Settings -> Secrets and variables -> Actions).
# Without it the run fails loudly (the scanner never fabricates data).
#
# Mirrors the sibling scanners' convention (card-trader / myp): manual dispatch by default;
# the daily cron is commented out so the operator opts in (controls billing/credit burn).

on:
  workflow_dispatch:
    inputs:
      era:
        description: 'Era to scan'
        required: false
        default: 'vintage'
        type: choice
        options: ['vintage', 'middle', 'recent', 'all']
      max_pages:
        description: 'Max COMC pages per set (top pages by price; 0 = all)'
        required: false
        default: '3'
      min_margin:
        description: 'Min gross margin fraction (e.g. 0.20)'
        required: false
        default: '0.20'
      max_run_seconds:
        description: 'Time budget for the run (0 = unlimited)'
        required: false
        default: '2400'
  # Daily run — opt in by uncommenting (and confirm FIRECRAWL_API_KEY is set):
  # schedule:
  #   - cron: '0 9 * * *'   # 09:00 UTC daily

concurrency:
  group: comc-scan
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests rapidfuzz

      - name: Run targeted COMC scan
        # Inputs are passed via env (NOT interpolated into the script body) so the GitHub
        # template engine never expands untrusted dispatch input into shell — avoids CI/CD
        # script injection. The scanner also validates these args (era is a fixed choice;
        # the numeric ones are parsed as float/int and fall back to defaults).
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          PYTHONIOENCODING: utf-8
          ERA_INPUT: ${{ github.event.inputs.era || 'vintage' }}
          MAXP_INPUT: ${{ github.event.inputs.max_pages || '3' }}
          MARGIN_INPUT: ${{ github.event.inputs.min_margin || '0.20' }}
          BUDGET_INPUT: ${{ github.event.inputs.max_run_seconds || '2400' }}
        run: |
          if [ -z "$FIRECRAWL_API_KEY" ]; then
            echo "::error::FIRECRAWL_API_KEY secret is not set — cannot fetch COMC headlessly."
            exit 1
          fi
          python -m comc_scanner targeted \
            --era "$ERA_INPUT" \
            --max-pages "$MAXP_INPUT" \
            --min-margin "$MARGIN_INPUT" \
            --max-run-seconds "$BUDGET_INPUT" \
            --no-sheets --restart

      - name: Show deal summary in the run log
        if: always()
        run: |
          echo "### COMC deals (latest)" >> "$GITHUB_STEP_SUMMARY"
          if ls results/comc_deals_*_latest.csv >/dev/null 2>&1; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cut -d, -f2,3,4,5,6,7,8,10 results/comc_deals_*_latest.csv | head -55 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "(no deals file produced)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload scan outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comc-scan-${{ github.run_id }}
          path: |
            results/comc_deals_*_latest.csv
            results/comc_deals_*_latest.json
          retention-days: 30
          if-no-files-found: warn

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "COMC scan failed: run ${{ github.run_id }}" \
            --body "Scan failed at $(date -u +'%Y-%m-%d %H:%M UTC'). Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true
