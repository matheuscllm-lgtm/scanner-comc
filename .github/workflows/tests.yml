name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest requests rapidfuzz
      - name: Run offline tests (no network)
        # All tests under tests/ are offline (no live COMC/TCGCSV); test_parse_real.py
        # validates the parser against a committed real COMC page fixture.
        run: python -m pytest -q tests/
