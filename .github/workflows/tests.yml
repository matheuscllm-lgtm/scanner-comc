name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest rapidfuzz
      - name: Run offline tests (no network)
        run: python -m pytest -q tests/test_normalize.py tests/test_matcher.py tests/test_segments.py
