name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest requests rapidfuzz
      - name: Run offline tests (no network, no browser)
        # All tests under tests/ are offline and need no real browser: a committed
        # page fixture stands in for the live storefront, so CI stays green without
        # installing Chromium. No secrets are used.
        run: python -m pytest -q tests/
