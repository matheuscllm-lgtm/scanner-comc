[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comc-scanner"
version = "0.2.0"
description = "COMC -> TCGPlayer arbitrage scanner for Pokemon TCG singles (gross margin > 20%)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
comc = ["playwright>=1.44", "playwright-stealth>=1.0.6", "selectolax>=0.3"]
sheets = ["gspread>=6.0", "google-auth>=2.29"]

[project.scripts]
comc-scanner = "comc_scanner.__main__:main"

[tool.setuptools]
packages = ["comc_scanner"]
