[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comc-scanner"
version = "0.4.2"
description = "COMC arbitrage scanner for Pokemon TCG (raw NM + graded slabs) vs TCGplayer/PriceCharting references"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
# patchright (a playwright stealth fork) is preferred at runtime when installed —
# comc_scraper auto-detects it and falls back to plain playwright.
comc = ["playwright>=1.44"]

[project.scripts]
comc-scanner = "comc_scanner.__main__:main"

[tool.setuptools]
packages = ["comc_scanner"]
